<div class="devices-page">
  <!-- Hero Header -->
  <div class="devices-hero">
    <div class="hero-content">
      <div class="hero-avatar">
        <i class="bi bi-hdd-network-fill"></i>
      </div>
      <div class="hero-text">
        <h1 class="hero-title">Manage Devices</h1>
        <p class="hero-subtitle">
          {{ devices.length }} {{ devices.length === 1 ? 'device' : 'devices' }} saved
        </p>
      </div>
      <button class="add-device-btn scan" (click)="openScan()">
        <i class="bi bi-wifi"></i>
        <span>Scan Devices</span>
      </button>
      <button class="add-device-btn" (click)="openAddWizard()">
        <i class="bi bi-plus-lg"></i>
        <span>Add New Device</span>
      </button>
    </div>
  </div>

  <!-- Saved Devices Section -->
  <div class="devices-section">
    <h5 class="section-title">
      <i class="bi bi-collection-fill"></i>
      Saved Devices
    </h5>

    @if (devices.length === 0) {
      <app-empty-state (add)="openAddWizard()"></app-empty-state>
    } @else {
      <app-device-list [devices]="devices" [statuses]="(state.statuses$ | async) ?? {}" [selected]="selectedSerial"
                       [actions]="actions" (pick)="state.choose($event)"></app-device-list>
      <ng-template #actions let-dev>
        <button class="device-btn primary" (click)="editDevice(dev)">
          <i class="bi bi-pencil-fill"></i>
          Edit
        </button>
        <button class="device-btn danger" (click)="removeDevice(dev)">
          <i class="bi bi-trash"></i>
        </button>
      </ng-template>
    }
  </div>
</div>
