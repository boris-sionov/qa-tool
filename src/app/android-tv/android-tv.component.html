<app-platform-rail active="android-tv" [compact]="true"></app-platform-rail>
<div class="modern-layout">
  <!-- Modern Top Navigation Bar -->
  <nav class="modern-navbar">
    <div class="navbar-container">
<div class="navbar-center">
        <!-- Navigation Links -->
        <div class="nav-pills-horizontal">
          <a class="nav-link-modern" routerLink="apps" routerLinkActive="active" replaceUrl title="Apps">
            <i class="bi bi-grid"></i>
            <span>Apps</span>
          </a>
          <a class="nav-link-modern" routerLink="info" routerLinkActive="active" replaceUrl title="Device Info">
            <i class="bi bi-info-circle"></i>
            <span>Info</span>
          </a>
          <a class="nav-link-modern" routerLink="devices" routerLinkActive="active" replaceUrl title="Manage Devices">
            <i class="bi bi-hdd-rack"></i>
            <span>Manage</span>
          </a>
        </div>
      </div>

      <div class="navbar-end">
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main role="main" class="modern-main">
    <router-outlet (activate)="onDevicesChanged()"></router-outlet>
  </main>
</div>
