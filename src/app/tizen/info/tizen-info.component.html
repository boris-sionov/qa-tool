<div class="info-page">
  @if (device) {
  <div class="manager-toolbar bg-panel border-bottom">
    <app-device-chip [name]="device.name" (back)="state.select(null)"></app-device-chip>
  </div>
  }

  <div class="info-content">
    @if (!device) {
      <app-device-picker kicker="Samsung" [devices]="pickerDevices" (pick)="pick($event)"></app-device-picker>
    } @else if (loading) {
      <app-spinner size="lg" [center]="true"></app-spinner>
    } @else if (error) {
      <div class="error-state">
        <div class="error-icon">
          <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h4>Failed to Load Device Info</h4>
        <p>{{ error.message || 'Unable to get device info' }}</p>
        <button class="retry-btn" (click)="loadInfo(device!)">
          <i class="bi bi-arrow-clockwise"></i>
          Retry
        </button>
      </div>
    } @else {
      <div class="info-hero">
        <div class="hero-content">
          <div class="hero-avatar samsung-avatar">
            <span class="samsung-s">S</span>
          </div>
          <div class="hero-text">
            <h1 class="hero-title">{{ device.name }}</h1>
            <p class="hero-subtitle">
              <i class="bi bi-circle-fill status-dot"></i>
              Connected
            </p>
          </div>
          <button class="copy-btn-hero" (click)="copyDeviceInfo()"
                  [class.copy-success]="copySuccess"
                  ngbTooltip="Copy Model Name & Tizen Version" placement="bottom">
            <i class="bi" [ngClass]="copySuccess ? 'bi-check-circle-fill' : 'bi-clipboard'"></i>
            <span>{{ copySuccess ? 'Copied!' : 'Copy Info' }}</span>
          </button>
        </div>
      </div>

      <div class="info-section">
        <div class="device-summary-cards">
          @for (item of info; track item.label) {
            <div class="summary-card">
              <i class="bi summary-icon" [ngClass]="item.icon"></i>
              <span class="summary-label">{{ item.label }}</span>
              <span class="summary-value">{{ item.value || '—' }}</span>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
