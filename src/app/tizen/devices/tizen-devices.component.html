<div class="devices-page">
  <div class="devices-hero">
    <div class="hero-content">
      <div class="hero-avatar samsung-avatar">
        <span>S</span>
      </div>
      <div class="hero-text">
        <h1 class="hero-title">Samsung Tizen Devices</h1>
        <p class="hero-subtitle">{{ devices.length }} {{ devices.length === 1 ? 'device' : 'devices' }} saved</p>
      </div>
      <button class="requirements-btn" type="button" (click)="requirements.open()"
              [class.missing]="requirements.missing"
              [title]="requirements.missing ? 'Something Samsung needs is missing on this computer — show what' : 'Check that this computer has what Samsung needs'">
        <i class="bi" [class.bi-clipboard-check]="!requirements.missing" [class.bi-exclamation-triangle-fill]="requirements.missing"></i>
        <span>Requirements</span>
      </button>
      <button class="requirements-btn" type="button" (click)="openScan()">
        <i class="bi bi-wifi"></i>
        <span>Scan Devices</span>
      </button>
      <button class="add-device-btn" (click)="openAddWizard()">
        <i class="bi bi-plus-lg"></i>
        <span>Add New Device</span>
      </button>
    </div>
  </div>

  <div class="devices-section">
    <h5 class="section-title">
      <i class="bi bi-collection-fill"></i>
      Saved Devices
    </h5>

    @if (devices.length === 0) {
      <app-empty-state icon="bi-inbox" title="No devices yet" text="Use Add New Device above to add your first Samsung TV."></app-empty-state>
    } @else {
      <div class="devices-grid">
        @for (dev of devices; track dev.ip + ':' + dev.port) {
          <div class="device-card" [class.selected]="isSelected(dev)">
            <div class="device-card-header">
              <div class="device-icon" [class.active]="isSelected(dev)">
                <span>S</span>
              </div>
              @if (isSelected(dev)) {
                <span class="status-badge active">
                  <i class="bi bi-check-circle-fill"></i>
                  Selected
                </span>
              }
            </div>
            <div class="device-card-body">
              <h4 class="device-name">{{ dev.name }}</h4>
              <div class="device-info">
                <i class="bi bi-router"></i>
                <span>{{ dev.ip }}</span>
              </div>
            </div>
            <div class="device-card-actions">
              <button class="device-btn primary" (click)="editDevice(dev)">
                <i class="bi bi-pencil-fill"></i> Edit
              </button>
              <button class="device-btn danger" (click)="removeDevice(dev)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>


</div>
