<div class="tile"><i class="bi bi-tv"></i></div>
<h3>No device detected</h3>
@if (link) {
  <a class="btn btn-primary" [routerLink]="link"><i class="bi bi-plus-lg"></i>Add new device</a>
} @else {
  <button type="button" class="btn btn-primary" (click)="add.emit()"><i class="bi bi-plus-lg"></i>Add new device</button>
}
