<nav class="rail" [class.compact]="compact" aria-label="Platforms">
  @if (compact) {
    <button class="home-btn" type="button" title="Home" aria-label="Home" (click)="home()">
      <i class="bi bi-grid-3x3-gap"></i>
    </button>
  }
  @for (p of platforms; track p.id) {
    <button class="tile" type="button" [class.active]="p.id === active" [attr.aria-pressed]="p.id === active"
            [attr.aria-label]="p.name" [title]="p.name" (click)="pick(p)">
      <img [src]="'assets/platform-logos/' + p.logo" alt="">
    </button>
  }
</nav>
