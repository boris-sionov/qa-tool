<div class="home" [style.--brand]="current.brand" [style.--brand-glow]="current.glow">
  <app-platform-rail [active]="current.id" [navigate]="false" (picked)="select($event)"></app-platform-rail>

  <main class="stage">
    <div class="aura"></div>

    <section class="panel" [attr.aria-label]="current.name">
      <div class="hero">
        <img [src]="'assets/platform-logos/' + current.logo" [alt]="current.name">
      </div>

      <div class="info">
        <div class="actions">
          <button class="action primary" type="button" (click)="open('apps')">
            @switch (stage.primary.icon) {
              @case ('plug') { <svg viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M7 8h10v3a5 5 0 0 1-10 0zM12 16v6"/></svg> }
              @default { <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg> }
            }
            {{ stage.primary.label }}
          </button>
          @for (a of stage.actions; track a.path) {
            <button class="action" type="button" (click)="open(a.path)">
              @switch (a.icon) {
                @case ('tv') { <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M8 21h8"/></svg> }
                @case ('usb') { <svg viewBox="0 0 24 24"><circle cx="7" cy="14" r="2.5"/><path d="M9.5 14H20M13 14V6l-2 2M16 14v4"/><rect x="14.5" y="18" width="3" height="3" rx=".5"/></svg> }
                @default { <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg> }
              }
              <span>{{ a.label }}<small>{{ a.hint }}</small></span>
            </button>
          }
        </div>

        @if (devices?.length) {
          <div class="recent">
            <h4>Saved devices</h4>
            @for (d of devices; track d.ip) {
              <div class="dev"><b>{{ d.name }}</b><code>{{ d.ip }}</code></div>
            }
          </div>
        } @else if (stage.note) {
          <p class="note">{{ stage.note }}</p>
        }
      </div>
    </section>

    <div class="footer">
      {{ appName }} v{{ appVersion }}
      <span class="update-notice" *ngIf="update" role="status">
        · v{{ update.version.version }} is available
        <a [href]="update.release.html_url" appExternalLink>Download</a>
        <button type="button" (click)="dismissUpdate()">Not now</button>
      </span>
    </div>
  </main>
</div>
