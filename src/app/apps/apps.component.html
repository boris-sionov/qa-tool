<div class="w-100 h-100 d-flex flex-column overflow-visible" xmlns="http://www.w3.org/1999/html">
  <div class="manager-toolbar bg-panel border-bottom">
    <!-- Device Selector -->
    <div class="device-selector-container" ngbDropdown>
      <button class="device-dropdown-btn" ngbDropdownToggle>
        <i class="bi bi-tv"></i>
        <span class="device-name">{{ device ? device.name : 'No device selected' }}</span>
        <i class="bi bi-chevron-down chevron"></i>
      </button>
      <div ngbDropdownMenu class="device-dropdown-menu">
        @if ((devices$ | async)?.length === 0) {
          <span class="device-dropdown-empty">No devices saved</span>
        }
        @for (dev of devices$ | async; track dev.name) {
          <button ngbDropdownItem class="device-dropdown-item"
                  [class.active]="dev.name === device?.name"
                  (click)="deviceManager.setDefault(dev.name)">
            <i class="bi bi-check2 check-icon" [class.invisible]="dev.name !== device?.name"></i>
            <span>{{ dev.name }}</span>
          </button>
        }
      </div>
    </div>

    <!-- Install Button -->
    <div class="install-btn-container">
      @if (!minimal) {
        <button class="btn btn-outline-light text-nowrap install-btn me-2" (click)="installFromConfluence()"
                title="Install the newest UAT or PREPROD build from Confluence">
          <i class="bi bi-journal-arrow-down me-2"></i>From Confluence
        </button>
      }
      <button class="btn btn-primary text-nowrap install-btn" (click)="openInstallChooser()">
        <i class="bi bi-folder-fill me-2"></i>Install
      </button>
    </div>
  </div>
  <div class="p-3 flex-fill overflow-auto apps-scroll">
    @if (!device) {
      <div class="lg-empty-state">
        <i class="bi bi-hdd-network"></i>
        <h3>No device detected</h3>
        <p>Go to <strong>Manage</strong> and add an LG device to get started.</p>
      </div>
    } @else {
      <app-installed #installedComponent [device]="device" [installed$]="packages$"></app-installed>
    }
  </div>
</div>
