<div class="w-100 h-100 d-flex flex-column overflow-visible" xmlns="http://www.w3.org/1999/html">
  @if (device) {
  <div class="manager-toolbar bg-panel border-bottom">
    <app-device-chip [name]="device.name" (back)="deviceManager.select(null)"></app-device-chip>

    <!-- Install Button -->
    <div class="install-btn-container">
      <app-install-menu [sources]="installSources" (choose)="install($event)"></app-install-menu>
    </div>
  </div>
  }
  <div class="p-4 flex-fill overflow-auto apps-scroll">
    @if (!device) {
      <app-device-picker kicker="LG" [devices]="(deviceManager.pickerDevices$ | async) ?? []"
                         (pick)="deviceManager.select($event)"></app-device-picker>
    } @else {
      <app-installed #installedComponent [device]="device" [installed$]="packages$"></app-installed>
    }
  </div>
</div>
